name: Deploy

on:
  workflow_run:
    workflows: [Build]
    types:
      - completed
    branches: 
      - main

env:
  NUKE_TELEMETRY_OPTOUT: 1

  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: 1
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 0

concurrency: 
  group: ${{ github.workflow}}-${{ github.ref_name }}

jobs:
  deploy:
    permissions: 
      id-token: write
    environment: production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          name: build
          path: ./artifacts

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI Action
        uses: Azure/cli@v3
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        with: 
          inlineScript: |
            tdnf install -y dotnet-sdk-10.0
            # Install dependencies for .NET installation script
            #tdnf install -y gawk
            #tdnf install -y tar
            #tdnf install -y perl

            # Install dependencies for .NET
            #tdnf install -y icu

            # Install additional tool dependencies
            tdnf install -y azcopy

            chmod +x $GITHUB_WORKSPACE/build.sh
            $GITHUB_WORKSPACE/build.sh Deploy --environment prd --cloudflare-api-key "$CLOUDFLARE_API_KEY" --cloudflare-zone-id "$CLOUDFLARE_ZONE_ID" --turnstile-secret-key "$TURNSTILE_SECRET_KEY"

